<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinLocker v1.0 — Secure Utility</title>
    <style>
        :root {
            --bg-color: #05050a;
            --card-bg: #0b0f19;
            --border-color: #1e293b;
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.2);
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Фоновый кибер-эффект сетки */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .terminal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
            text-align: center;
            max-width: 440px;
            width: 90%;
            position: relative;
        }

        /* Строка статуса терминала сверху */
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 50%;
        }

        .dot:nth-child(1) { background-color: #ff5f56; }
        .dot:nth-child(2) { background-color: #ffbd2e; }
        .dot:nth-child(3) { background-color: #27c93f; }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: var(--accent-green);
            text-shadow: 0 0 10px var(--accent-glow);
            letter-spacing: 1px;
        }

        .version {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-green);
            border: 2px solid var(--accent-green);
            text-decoration: none;
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 15px var(--accent-glow);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-btn:hover {
            background-color: var(--accent-green);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--accent-green);
            transform: translateY(-2px);
        }

        .system-info {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="terminal-card">
        <div class="terminal-header">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <span>root@secure-node:~#</span>
        </div>

        <h1>WinLocker</h1>
        <div class="version">Version 1.0 // Stable Build</div>
        
        <p>Инициализация защищенного модуля завершена. Нажмите кнопку ниже для старта развертывания утилиты.</p>
        
        <a href="live.exe" class="download-btn" download>Загрузить файл</a>
        
        <div class="system-info">Статус: Доступно для загрузки [EXE]</div>
    </div>

</body>
</html>
